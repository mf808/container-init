name: Release

# On every merge to main: re-run the suite, then auto-version, build, and publish
# the image to GHCR as both an immutable vX.Y.Z tag and the moving `latest` tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mf808/container-init

# Least-privilege default for the test job; the release job declares its own
# elevated grants below, which override this. (CodeQL:
# actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the vX.Y.Z git tag + GitHub Release
      packages: write    # push the image to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the version is computed from all commits

      - name: Compute next version from commit messages
        id: tag
        # Third-party actions in this job run with contents/packages write access,
        # so they are pinned to commit SHAs (tags are mutable and hijackable).
        # Dependabot updates SHA pins and their version comments automatically.
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch   # fix:->patch, feat:->minor, feat!/BREAKING->major

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.new_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.new_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
